[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotify-rank"
version = "0.2.0"
description = "Multimodal audio-text ranking engine for podcast ad-break placement"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# Deliberately dependency-light: the baseline, the metrics and the whole dataset
# pipeline must run with no network access, no model downloads and no paid APIs.
# Audio decoding reuses the FFmpeg binaries the product already requires rather
# than adding a decoding library. The learned-feature stack (PyTorch,
# transformers, sentence-transformers, librosa) is the `features` extra below.
dependencies = [
    "pyyaml>=6.0.1",
    # Millisecond energy envelopes over hours of audio; pure Python cannot do
    # this at corpus scale.
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # TestClient for the labelling service endpoints.
    "httpx>=0.27",
]
# The local labelling UI. Optional so the dataset pipeline installs without a
# web stack.
label = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
# Phase 3: local transcription, frozen speech representations and frozen
# transcript embeddings. Optional and deliberately heavy -- installing it pulls
# roughly 1 GB of wheels -- so Phase 1 parity checks and the Phase 2 dataset
# pipeline keep installing in seconds without it.
#
# CPU-only by design. On Windows the default PyPI `torch` wheel *is* the CPU
# build, so no alternate index is configured; the code auto-detects CUDA and
# falls back to CPU when it is absent (see slotify_rank.embeddings.device).
features = [
    "torch>=2.2,<3.0",
    "transformers>=4.40,<5.0",
    "sentence-transformers>=2.7,<6.0",
    # Spectral/onset descriptors. Reimplementing STFT-based centroid, bandwidth,
    # roll-off, contrast and onset strength by hand would be a large, subtly
    # wrong dependency of our own.
    "librosa>=0.10,<0.12",
    # librosa pulls numba transitively, and the resolver will happily backtrack
    # to numba 0.53 (Python <3.10 only) to satisfy other pins. 0.60 is the first
    # release with real 3.12 support; without this floor the install fails.
    "numba>=0.60",
    "soundfile>=0.12",
    "scipy>=1.11",
]

[project.scripts]
slotify-rank = "slotify_rank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
slotify_rank = ["labelling/templates/*.html", "labelling/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run is network-free and downloads no model weights. The
# model_smoke tests are the deliberate exception and are excluded here; run them
# explicitly with `-m model_smoke`.
addopts = "-q -m 'not model_smoke'"
markers = [
    "slow: tests that load real model weights",
    "audio: tests that decode the real repository smoke fixtures via FFmpeg",
    "model_smoke: opt-in tests that download and run the real local models",
]
