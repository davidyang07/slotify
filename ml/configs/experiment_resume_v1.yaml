# The canonical resume experiment, defined before the test set is touched.
#
# WHY THIS FILE EXISTS. An experiment decided after seeing the result is not an
# experiment. Everything that could be tuned to flatter the headline number --
# which split, which seeds, which model variant is "the" model, which baseline is
# the denominator, what counts as a relevant candidate, how many labels are
# enough -- is fixed here, committed, and hashed into the manifest before the
# test split is read for the first time.
#
# `slotify-rank experiment manifest` resolves this file into
# artifacts/experiments/experiment_resume_v1.json, which pins the actual bytes:
# the split manifest hash, the candidate manifest hash, the label snapshot hash,
# the feature schema versions and the resolved model configuration. A result
# reported against experiment-resume-v1 always means those bytes.
#
# WHAT MAY STILL CHANGE AFTER THIS IS WRITTEN. Model architecture, features and
# training hyperparameters -- tuned on train and *validation* only. That is
# ordinary model development and it is why a validation split exists. What may
# not change is anything below marked FROZEN.

experiment_version: experiment-resume-v1
schema_version: experiment-config-v1.0.0

corpus:
  plan: ml/configs/corpus_resume_v1.yaml
  source_registries:
    - ml/configs/sources_real_v1.yaml
    - ml/configs/sources_resume_v1.yaml
  candidate_generation_config: ml/configs/dataset_v1.yaml

# FROZEN. The split is a commitment: models are trained against it and results
# are reported against it.
split:
  config: ml/configs/splits_v3.yaml
  version: v3
  # Restated here so the manifest records what the experiment believed it was
  # using; `experiment manifest` fails if the split manifest disagrees.
  group_by: series
  seed: 42
  ratios:
    train: 0.70
    validation: 0.15
    test: 0.15

labels:
  queue_config: ml/configs/labelling_queue_resume_v1.yaml
  queue_artifact: data/labels/queue_resume_v1.json
  snapshot_version: resume-v1
  rubric: docs/labelling-guide.md
  # FROZEN. The experiment does not begin until this many unique human-labelled
  # candidates exist. It is a gate, not a target to be relaxed if labelling is
  # slow.
  minimum_human_labels: 2400
  # Only human judgements. Named explicitly so a weak-label run can never be
  # mistaken for this experiment.
  allowed_label_sources: [human]

model:
  # The variant whose number is quoted. The other four are ablations reported
  # alongside it, not alternatives to be picked from after the fact.
  headline_variant: gated
  ablations: [handcrafted, text_only, audio_only, concat, gated]
  config_dir: ml/configs/models
  training_config: ml/configs/training_v1.yaml
  # FROZEN. Checkpoint selection is on validation NDCG@3, and the reported model
  # is the median seed by validation NDCG@3 -- not the best. Reporting the best
  # of several seeds is seed cherry-picking with extra steps.
  seeds: [42, 43, 44]
  seed_selection: median_validation_ndcg_at_3
  checkpoint_selection_metric: validation_ndcg_at_3

baselines:
  # FROZEN. The denominator of the published improvement. Credential-free,
  # untrained, reproducible by anyone; its constants live in
  # config/heuristic_offline_v1.json and CI asserts they have not moved.
  canonical: heuristic_offline_v1
  # Reported alongside, never as the denominator: a scikit-learn gradient-boosted
  # model on the handcrafted scalars alone, tuned by episode-grouped
  # cross-validation inside the training split. It answers "would a good tabular
  # model have done just as well?"
  classical: classical_handcrafted_v1

evaluation:
  # FROZEN.
  primary_metric: ndcg_at_3
  cutoffs: [1, 3, 5]
  relevance_threshold: 4.0
  gain_offset: 1.0
  # Percentile bootstrap over episodes, because the metric is macro-averaged over
  # episodes and the episode is the unit of resampling.
  bootstrap_resamples: 2000
  bootstrap_confidence: 0.95
  bootstrap_seed: 20260829
  # Verify this project's NDCG against sklearn.metrics.ndcg_score before the
  # number is published.
  require_independent_metric_crosscheck: true

# The claim this experiment exists to support or refute. Stated in advance so the
# report can say PASS or FAIL against it rather than describing whatever came out.
#
# The threshold is NOT a target the pipeline may steer toward. If the measured
# improvement is below it, the evidence report says FAIL and the claim stays
# unsupported.
claim:
  statement: >-
    Trained on 2,400+ labelled candidates, improving NDCG@3 by 18% over the
    heuristic baseline.
  minimum_human_labels: 2400
  minimum_relative_improvement_percent: 18.0
