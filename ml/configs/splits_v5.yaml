# Split configuration v5 -- the v4 rules, under the corrected stratified
# algorithm. OPT-IN: the canonical split is v4 (splits_v4.yaml), which
# experiment v2 is frozen against. Use this one with --config.
#
# WHY A SEPARATE VERSION. A split manifest is IMMUTABLE for a given version:
# models are trained against it and results are reported against it. Nothing in
# v4's rules changes here. What changes is the algorithm that applies them:
#
#   v4  split-stratified-greedy-v1.0.0  (canonical; regenerates byte for byte)
#   v5  split-stratified-greedy-v1.1.0  (opt-in, pinned below)
#
# v1.0.0 promised to balance each content type against targets computed *within
# that content type*, and did not: every content type was measured against the
# corpus-wide duration target, count target and running total. Whichever type
# was assigned first could then fill a partition's whole budget and leave the
# next nothing. On a corpus of 20 narrated series (60 h) and 14 podcasts (14 h)
# that put zero podcasts in validation. v1.1.0 gives each content type its own
# 70/15/15 -- renormalized over the partitions it may enter, so the audiobooks
# barred from test split 70:15 between train and validation.
#
# On the committed corpus v4 gives test 7 episodes / 3 series / 3.16 h of
# podcasts (15 % of *all* the hours). v5 would give about 6 / 3 / 1.74 h (15 %
# of the podcast hours; estimated from the registries' declared durations) --
# exactly at the three-series floor below.
#
# RECOMMENDED for a future pre-registered experiment, and for any corpus whose
# content types are unbalanced, where v4's corpus-wide targets can leave a
# partition with none of a type. It does not replace v4 for experiment v2.
#
# `algorithm_version` is pinned below and used exactly. An unpinned stratified
# config (v4) keeps split-stratified-greedy-v1.0.0, so neither can be quietly
# regenerated under the other's algorithm, with or without --force.
#
# Every rule below is v4's, unchanged, with v4's reasoning (see
# splits_v4.yaml for the full account of what each one prevents).

split:
  version: v5
  algorithm_version: split-stratified-greedy-v1.1.0
  seed: 42
  group_by: series

  ratios:
    train: 0.70
    validation: 0.15
    test: 0.15

  # Balance each content type across the partitions separately -- now against
  # each content type's own targets.
  stratify_by: content_type

  # Music and any supplemental out-of-domain material stay out of the test
  # partition entirely; `test_content_types` below is strictly stronger.
  require_target_domain_test: true

  # The test partition is the product's actual task or it is not the test
  # partition. Under per-content-type targets it holds 15 % of the podcast
  # hours, not 15 % of the corpus.
  test_content_types: [podcast]

  # No series may take more than half a partition's duration budget (the
  # budget being what every content type owes that partition).
  max_group_share_of_partition: 0.5

  # Three independent shows is the floor for reporting a macro-averaged metric
  # over a partition. A hard failure, not a warning: widen the corpus rather
  # than lowering it.
  min_series_per_partition: 3

  # Below this many independent series the splitter degrades to a single
  # 'development' partition rather than producing a "test set" of one show.
  min_groups_for_split: 6
