    max_duration_seconds: 1900
    homepage: https://www.whatisitabouttheweather.com/
    notes: >-
      Mark T Jelinek's interview podcast on weather and its effect on daily
      life. CC BY-SA 4.0 on all 222 items; episodes 9-31 minutes.

