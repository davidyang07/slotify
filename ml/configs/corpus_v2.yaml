    licence: open_licence_self_published
    selection:
      kind: collection_items
      collection: freewillsciencereligionpodcast
      max_episodes: 2
    min_duration_seconds: 480
    max_duration_seconds: 1900
    homepage: http://causalconsciousness.com/
    notes: >-
      Multi-host philosophy discussion podcast (Chandler Klebs, George Ortega
