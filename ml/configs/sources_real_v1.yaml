# Real target-domain corpus -- Phase 5A, round 1.
#
# WHERE the audio comes from and under WHAT TERMS. This file is committed; it
# holds no audio and no credentials. `slotify_rank.data.sources.load_sources`
# validates every entry (licence required for direct_download, no secrets, real
# audio-file URLs only) before any byte is fetched.
#
# PROVENANCE. Every entry below was discovered and verified against the Internet
# Archive metadata API (https://archive.org/metadata/<identifier>) during the
# Phase 5A survey: the identifier exists, the file name and duration are real,
# and the item's `licenseurl` is a public-domain dedication or the Public Domain
# Mark. Nothing here is a guessed URL. The direct download URL follows the
# documented pattern https://archive.org/download/<identifier>/<file>.
#
# LICENCE. All six series are LibriVox recordings hosted by the Internet Archive
# and released into the public domain, so they are freely redistributable and
# re-fetchable -- the two properties the dataset card requires. Podcast and
# interview feeds under CC-BY may be appended later (same schema, one new series
# each) without touching any code; see docs/human-labelling-workflow.md.
#
# DOMAIN. Narrated spoken word and a multi-voice dramatic reading. Both are
# TARGET_DOMAIN_CONTENT_TYPES. No music, no meetings.
#
# Acquire the whole corpus with:
#   cd backend  # (any dir; the command is run from ml/ below)
#   .venv/Scripts/python.exe -m slotify_rank.cli dataset fetch \
#       --sources ml/configs/sources_real_v1.yaml
#   ... then dataset probe / normalize / candidates generate / features, etc.
# See docs/human-labelling-workflow.md for the full, copy-pasteable sequence.

source_manifest_version: source-manifest-v1.0.0

defaults:
  language: en
  source_name: "LibriVox / Internet Archive"
  attribution: "Read for LibriVox (public domain); hosted by the Internet Archive."

