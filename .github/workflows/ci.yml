name: CI

# Credential-free by design. Every job here runs with no API keys, no model
# downloads and no network access beyond the package registries, because the
# placement engine's core -- the baseline, the metrics, the dataset pipeline and
# the inference contract -- is meant to be reproducible by anyone who clones the
# repository. Anything that needs Hugging Face weights lives in model-smoke.yml
# and is triggered manually, so a Hugging Face outage cannot turn an unrelated
# pull request red.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  scripts:
    # The demo and preflight entry points choose which checkpoint the product
    # serves. Getting that wrong means shipping a distillation of the baseline
    # while a human-trained model sits unused, so the selection has its own
    # tests and they run on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:scripts

      - name: Repository hygiene
        # Judges what is COMMITTED, not what is in a working tree: a cache, a
        # credential or a corpus file is permanent once it is in the history.
        run: node -e "import('./scripts/lib/hygiene.mjs').then(async (m) => { const { execFileSync } = await import('node:child_process'); const tracked = execFileSync('git', ['ls-files'], { encoding: 'utf8', maxBuffer: 33554432 }).split(/\r?\n/); const findings = m.hygieneFindings(tracked); for (const f of findings) console.error(`${f.path} - ${f.rule}: ${f.reason}`); if (findings.length) process.exit(1); console.log(`${tracked.filter(Boolean).length} tracked file(s), no findings.`); });"

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ffmpeg
        # The dataset pipeline decodes through the same ffmpeg the product uses
        # rather than a Python decoding library, so the audio-marked tests need it.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the package and its extras
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,label,features,sklearn]"
      - name: Verify the ranking package
        # The same command a developer runs: `npm run verify:ml`. It runs the
        # test suite, then re-derives both generated reports from the committed
        # artifacts and compares -- the one failure mode a generated report
        # cannot catch by itself is being true when it was written and not any
        # more. Nothing is recomputed first; recomputing the artifacts would
        # quietly repair the very disagreement the check exists to find.
        #
        # It also asserts every IMPLEMENTATION claim in the evidence report is
        # established by committed code, a test and an artifact. It asserts
        # nothing about the empirical claims: those need human labels, which no
        # amount of CI can supply, and the report reports them as unmeasured.
        #
        # The dataset-level steps read data/, which is not committed. They
        # report themselves as skipped by name rather than passing silently.
        run: node scripts/verify-ml.mjs

  corpus-registry:
    # The committed source registry is generated from the committed corpus plan.
    # Re-resolving it needs the Internet Archive, so it is NOT on the pull-request
    # path: an Archive outage must not turn an unrelated change red. This job
    # proves the plan and the registry still parse, offline, on every push, and
    # the networked `dataset discover --check` runs on the weekly schedule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate the corpus plan and the generated registry
        working-directory: ml
        run: python -m pytest tests/test_discover.py -q

  parity:
    # The TypeScript scorer is the source of truth for heuristic_offline_v1 and
    # the Python port must reproduce it exactly. Regenerating the golden fixture
    # here and asserting it is unchanged catches a drift that neither language's
    # own tests would notice.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Regenerate the golden fixture from the TypeScript scorer
        working-directory: backend
        run: npx tsx scripts/dump-heuristic-golden.ts --out ../ml/tests/fixtures/heuristic_golden.json
      - name: Assert the committed fixture is unchanged
        run: |
          if ! git diff --quiet -- ml/tests/fixtures/heuristic_golden.json; then
            echo "::error::The TypeScript scorer no longer produces the committed golden fixture."
            echo "heuristic_offline_v1 is the frozen denominator for every NDCG comparison."
            echo "If this change is intended, bump config_version in config/heuristic_offline_v1.json"
            echo "and commit the regenerated fixture."
            git diff -- ml/tests/fixtures/heuristic_golden.json
            exit 1
          fi
          echo "Golden fixture unchanged."
