name: CI

# Credential-free by design. Every job here runs with no API keys, no model
# downloads and no network access beyond the package registries, because the
# placement engine's core -- the baseline, the metrics, the dataset pipeline and
# the inference contract -- is meant to be reproducible by anyone who clones the
# repository. Anything that needs Hugging Face weights or the Internet Archive
# lives in model-smoke.yml and runs manually or on a weekly schedule, so an
# outage of either cannot turn an unrelated pull request red.
#
# Actions are referenced by major tag (actions/checkout@v4), not by commit SHA.
# A SHA pin is the stronger guarantee -- a tag can be moved to different code --
# and is the thing to switch to if a job here is ever given a secret. Today no
# job has one, and the token is read-only (below), so a moved tag could break
# or falsify a build but not publish anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository, so the GITHUB_TOKEN cannot either.
permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  scripts:
    # The demo and preflight entry points choose which checkpoint the product
    # serves. Getting that wrong means shipping a distillation of the baseline
    # while a human-trained model sits unused, so the selection has its own
    # tests and they run on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:scripts

      - name: Repository hygiene
        # Judges what is COMMITTED, not what is in a working tree. A cache, a
        # credential, a corpus file or an oversized blob is permanent once it is
        # in the history.
        run: node scripts/check-hygiene.mjs

  backend:
    # The API spawns `python -m ad_inserter.analyze_cli` for every analysis, so
    # the backend is not tested without the Python it runs: the ad_inserter
    # dependencies and ffmpeg are installed here, the Python tests run, and the
    # Node route tests run with SLOTIFY_REQUIRE_ANALYSER=1 -- without it the
    # insert-sections route test skips when the analyser cannot start, and a
    # missing dependency would read as a pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install ffmpeg
        # pydub decodes and exports through ffmpeg.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the ad_inserter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Python tests (ad_inserter)
        run: python -m pytest backend/tests/python -q
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npm test
        working-directory: backend
        env:
          PYTHON_BIN: python
          SLOTIFY_REQUIRE_ANALYSER: "1"

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          # Without this the cache is keyed on **/requirements.txt -- here
          # backend/requirements.txt, which this job never installs -- so a
          # change to what this job does install would not refresh it.
          cache-dependency-path: ml/pyproject.toml
      - name: Install ffmpeg
        # The dataset pipeline decodes through the same ffmpeg the product uses
        # rather than a Python decoding library, so the audio-marked tests need it.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install the package and its extras
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,label,features,sklearn]"
      - name: Verify the ranking package
        # The same command a developer runs: `npm run verify:ml`. It runs the
        # test suite, then the dataset-level validation steps.
        #
        # Those steps read data/, which is not committed. They report themselves
        # as skipped by name rather than passing silently.
        run: node scripts/verify-ml.mjs

  corpus-registry:
    # The committed source registry is generated from the committed corpus plan.
    # Re-resolving it needs the Internet Archive, so it is NOT on the pull-request
    # path: an Archive outage must not turn an unrelated change red. This job
    # proves the plan and the registry still parse, offline, on every push. The
    # networked `dataset discover --check` is the `corpus-registry-live` job in
    # model-smoke.yml: weekly and on demand, and a job of its own, so it runs
    # whether or not the Hugging Face model smoke tests pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/pyproject.toml
      - name: Install the package
        working-directory: ml
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Validate the corpus plan and the generated registry
        working-directory: ml
        run: python -m pytest tests/test_discover.py -q

  parity:
    # The TypeScript scorer is the source of truth for heuristic_offline_v1.
    # This job checks one thing: that backend/scripts/dump-heuristic-golden.ts,
    # run against the TypeScript scorer as it stands, still produces exactly the
    # committed golden fixture. A TypeScript change that would move the frozen
    # baseline fails here.
    #
    # It does not run the Python port. The port is held to the same committed
    # fixture by ml/tests/test_heuristic.py, in the ml job; the two jobs together
    # are the cross-language parity check. Nor does it exercise the route
    # itself: the dump script mirrors the route's slot finalisation rather than
    # importing it, so an edit to that block in the route alone is not seen here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Regenerate the golden fixture from the TypeScript scorer
        working-directory: backend
        run: npx tsx scripts/dump-heuristic-golden.ts --out ../ml/tests/fixtures/heuristic_golden.json
      - name: Assert the committed fixture is unchanged
        run: |
          if ! git diff --quiet -- ml/tests/fixtures/heuristic_golden.json; then
            echo "::error::The TypeScript scorer no longer produces the committed golden fixture."
            echo "heuristic_offline_v1 is the frozen denominator for every NDCG comparison."
            echo "If this change is intended, bump config_version in config/heuristic_offline_v1.json"
            echo "and commit the regenerated fixture."
            git diff -- ml/tests/fixtures/heuristic_golden.json
            exit 1
          fi
          echo "Golden fixture unchanged."
